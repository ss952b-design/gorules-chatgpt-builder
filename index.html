<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>GoRules AI Builder</title><link rel='stylesheet' href='style.css'></head><body><header><div class='brand'><div class='logo'>GR</div><div><b>GoRules AI Builder</b><small>Prompt → graph → review → export</small></div></div><span class='badge'>OpenAI + GoRules</span></header><main class='layout'><aside class='panel left'><label>OpenAI API key</label><input id='key' type='password' placeholder='Enter your OpenAI API key'><small>Your key stays in this browser tab only.</small><label>Model</label><input id='model' value='gpt-5'><label>Rule prompt</label><textarea id='prompt' placeholder='Describe the rule you want to build...'></textarea><div class='actions'><button id='generate'>Generate graph</button><button id='clear' class='secondary'>Clear</button></div><div id='status'>Ready.</div></aside><section class='right'><div class='panel chat'><div class='title'><b>ChatGPT rule assistant</b><span>ZEN-safe</span></div><div id='messages'></div><div class='composer'><input id='follow' placeholder='Revise the current graph...'><button id='send'>Send</button></div></div><div class='panel viewer'><div class='tabs'><button id='tabGraph' class='active'>Graph JSON</button><button id='tabNotes'>Validation</button></div><pre id='graph'>No graph generated yet.</pre><pre id='notes' hidden>No validation notes yet.</pre></div></section></main><script src='app.js'></script></body></html>
